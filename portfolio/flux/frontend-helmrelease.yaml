apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portfolio-frontend
  namespace: portfolio
spec:
  interval: 5m
  chart:
    spec:
      chart: portfolio-frontend
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: portfolio-charts
        namespace: flux-system
  values:
    replicaCount: 2
    image:
      repository: 665832051028.dkr.ecr.us-east-1.amazonaws.com/portfolio-frontend
      tag: "latest"
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi
      