apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: portfolio-backend
  namespace: portfolio
spec:
  interval: 5m
  chart:
    spec:
      chart: portfolio-backend
      version: "0.1.0"
      sourceRef:
        kind: HelmRepository
        name: portfolio-charts
        namespace: flux-system
  values:
    replicaCount: 2
    image:
      repository: 665832051028.dkr.ecr.us-east-1.amazonaws.com/portfolio-backend
      tag: "latest"
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 3001
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi