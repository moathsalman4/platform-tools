apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: monitoring
spec:
  interval: 10m
  releaseName: thanos
  targetNamespace: monitoring
  chart:
    spec:
      chart: thanos
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    existingObjstoreSecret: thanos-objstore-secret

    serviceAccount:
      create: false
      name: thanos-sa

    query:
      enabled: true
      replicaCount: 1
      stores:
        - thanos-sidecar.monitoring.svc.cluster.local:10901
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    storegateway:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    compactor:
      enabled: true
      retentionResolutionRaw: 30d
      retentionResolution5m: 60d
      retentionResolution1h: 180d
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        size: 10Gi
        storageClass: gp2

    # Disable components we don't need
    queryFrontend:
      enabled: false
    ruler:
      enabled: false
    receive:
      enabled: false
    bucketweb:
      enabled: false
