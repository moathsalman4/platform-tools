apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
  namespace: logging
spec:
  interval: 10m
  releaseName: eck-operator
  targetNamespace: elastic-system
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: eck-operator
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system