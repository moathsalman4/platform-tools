apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: logging
spec:
  interval: 10m
  releaseName: fluent-bit
  targetNamespace: logging
  dependsOn:
    - name: eck-stack
      namespace: logging
  chart:
    spec:
      chart: fluent-bit
      version: 0.47.10
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  values:
    env:
      - name: ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: efk-creds
            key: password
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 5
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On
      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 5MB
            Skip_Long_Lines On
            Exclude_Path /var/log/containers/fluent-bit*
        [INPUT]
            Name systemd
            Tag host.*
            Systemd_Filter _SYSTEMD_UNIT=kubelet.service
            Read_From_Tail On
      outputs: |
        [OUTPUT]
            Name              es
            Match             *
            Host              elasticsearch-es-http.logging.svc.cluster.local
            Port              9200
            Index             kubernetes-logs
            Suppress_Type_Name On
            tls               On
            tls.verify        Off
            HTTP_User         elastic
            HTTP_Passwd       ${ES_PASSWORD}
            Buffer_Size       256KB
            Retry_Limit       5
            Workers           1