apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: logging
spec:
  interval: 10m
  releaseName: fluent-bit
  targetNamespace: logging
  dependsOn:
    - name: eck-stack
      namespace: logging
  chart:
    spec:
      chart: fluent-bit
      version: 0.56.0
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  values:
    env:
      - name: ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: efk-creds
            key: password
    config:
      outputs: |
        [OUTPUT]
            Name              es
            Match             *
            Host              elasticsearch-es-http.logging.svc.cluster.local
            Port              9200
            Index             kubernetes-logs
            Suppress_Type_Name On
            tls               On
            tls.verify        Off
            HTTP_User         elastic
            HTTP_Passwd       ${ES_PASSWORD}
            Buffer_Size       256k
            Retry_Limit       5