apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: logging
spec:
  interval: 10m
  releaseName: fluent-bit
  targetNamespace: logging
  dependsOn:
    - name: eck-stack
      namespace: logging
  chart:
    spec:
      chart: fluent-bit
      version: 0.56.0
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
  values:
    config:
      outputs: |
        [OUTPUT]
            Name              es
            Match             *
            Host              elasticsearch-es-http.logging.svc.cluster.local
            Port              9200
            Index             kubernetes-logs
            Suppress_Type_Name On
            tls               Off